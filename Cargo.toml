[package]
name = "navidrome"
version = "0.1.0"
edition = "2021"
description = "Music streaming (Subsonic API) — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "navidrome"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "navidrome"
path = "src/main.rs"

# navidrome registers a ServiceBackend plus its `navidrome.` domain tools over
# the orca socket, reaching orca through plugin-toolkit alone. `delegated-http`
# sends every Subsonic API request through orca's `http.request` capability,
# so no reqwest/rustls is linked; `tools` + `db` carry the `#[orca_tool]` and
# `#[endpoint_resource]` surface.
[dependencies]
plugin-toolkit = { version = ">=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
